[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cregis-sdk"
version = "0.1.0"
description = "Official synchronous Python SDK for Cregis Payment Engine, WaaS, and Team APIs"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cregis" }]
keywords = ["cregis", "payment", "waas", "crypto", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.13,<3",
  "rfc8785==0.1.4",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14,<1.19",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cregis = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["src/cregis/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP037", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["cregis"]

[[tool.mypy.overrides]]
module = ["cregis.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["anyio.*"]
follow_imports = "skip"

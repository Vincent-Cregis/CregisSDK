name: TypeScript SDK CI

on:
  pull_request:
    paths:
      - "sdks/typescript/**"
      - "codegen/**"
      - ".github/workflows/typescript-ci.yml"
      - "README.md"
  push:
    branches:
      - main
    paths:
      - "sdks/typescript/**"
      - "codegen/**"
      - ".github/workflows/typescript-ci.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen-checks:
    name: Check generated boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out canonical OpenAPI specifications
        uses: actions/checkout@v7
        with:
          repository: 0xcregis/cregis-developer-docs
          token: ${{ secrets.CREGIS_DOCS_READ_TOKEN }}
          path: .openapi-source
          persist-credentials: false

      - name: Regenerate and compare committed files
        run: |
          ./codegen/scripts/generate-typescript-models.sh \
            --spec-dir .openapi-source/api-sources/specs \
            --check
          ./codegen/scripts/check-typescript-client-surface.py
          python3 -m json.tool codegen/configs/typescript-generator.json >/dev/null
          python3 -m json.tool codegen/configs/typescript-overrides.json >/dev/null
          python3 -m json.tool codegen/manifests/typescript-models.lock.json >/dev/null
          bash -n codegen/scripts/generate-typescript-models.sh

  test:
    name: Test on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: sdks/typescript

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify types, behavior, and package formats
        run: npm run verify

name: Publish Java SDK

on:
  push:
    tags:
      - "java-v*"

permissions:
  contents: read

concurrency:
  group: java-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 11 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Verify tag matches Maven version
        shell: bash
        run: |
          pom_version="$(mvn --quiet -f sdks/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${GITHUB_REF_NAME#java-v}"
          if [[ "${pom_version}" != "${tag_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Maven version ${pom_version}."
            exit 1
          fi

      - name: Verify version references
        run: ./scripts/verify-java-version.sh

      - name: Check publishing secrets
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          for secret_name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_TOKEN MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Verify release build
        run: mvn --batch-mode --no-transfer-progress -f sdks/java/pom.xml clean verify

      - name: Publish signed artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f sdks/java/pom.xml
          -Prelease
          -DskipTests
          -Dgpg.signer=bc
          deploy

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build release assets
        run: mvn --batch-mode --no-transfer-progress -f sdks/java/pom.xml -DskipTests package

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#java-v}"
          release_flags=()
          if [[ "${release_version}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "sdks/java/target/cregis-sdk-java-${release_version}.jar" \
            "sdks/java/target/cregis-sdk-java-${release_version}-sources.jar" \
            "sdks/java/target/cregis-sdk-java-${release_version}-javadoc.jar" \
            --title "Cregis Java SDK ${release_version}" \
            --generate-notes \
            "${release_flags[@]}"

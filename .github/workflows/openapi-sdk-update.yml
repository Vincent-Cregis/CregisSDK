name: Update SDKs from OpenAPI

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      spec_ref:
        description: Commit or branch in 0xcregis/cregis-developer-docs
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openapi-sdk-update
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPEC_REF: ${{ inputs.spec_ref || github.event.client_payload.sha || 'main' }}

    steps:
      - name: Check out SDK repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out exact OpenAPI source
        uses: actions/checkout@v7
        with:
          repository: 0xcregis/cregis-developer-docs
          token: ${{ secrets.CREGIS_DOCS_READ_TOKEN }}
          ref: ${{ env.SPEC_REF }}
          path: .openapi-source
          persist-credentials: false

      - name: Record OpenAPI source commit
        id: source
        run: |
          source_sha="$(git -C .openapi-source rev-parse HEAD)"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "short=${source_sha:0:12}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Regenerate Java and TypeScript contracts
        run: |
          ./codegen/scripts/generate-java-models.sh \
            --spec-dir .openapi-source/api-sources/specs
          ./codegen/scripts/generate-typescript-models.sh \
            --spec-dir .openapi-source/api-sources/specs

      - name: Verify generators and SDKs
        run: |
          python3 -m unittest discover -s codegen/tests -v
          mvn --batch-mode --no-transfer-progress -f sdks/java/pom.xml clean verify
          npm --prefix sdks/typescript ci
          npm --prefix sdks/typescript run verify

      - name: Commit generated changes
        id: changes
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_SHORT: ${{ steps.source.outputs.short }}
        run: |
          git add \
            codegen/manifests/java-models.lock.json \
            codegen/manifests/typescript-models.lock.json \
            sdks/java/src/generated/java \
            sdks/typescript/src/generated
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          branch="automation/openapi-${SOURCE_SHORT}"
          git checkout -B "${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(codegen): update SDKs from OpenAPI ${SOURCE_SHORT}"
          git push --force-with-lease --set-upstream origin "${branch}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.changes.outputs.branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if gh pr view "${BRANCH}" --json url >/dev/null 2>&1; then
            gh pr edit "${BRANCH}" \
              --title "chore(codegen): update SDKs from OpenAPI" \
              --body "Regenerated Java and TypeScript contracts from 0xcregis/cregis-developer-docs@${SOURCE_SHA}. All generator and SDK tests passed."
          else
            gh pr create \
              --base main \
              --head "${BRANCH}" \
              --title "chore(codegen): update SDKs from OpenAPI" \
              --body "Regenerated Java and TypeScript contracts from 0xcregis/cregis-developer-docs@${SOURCE_SHA}. All generator and SDK tests passed."
          fi
